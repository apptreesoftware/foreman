<!doctype html>
<html lang="en" data-theme="indigo">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foreman</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  /* Tokens. Each theme has a light set and a dark set; the OS setting picks which. Status colors
     (ok/warn/bad) mean the same thing in every theme. The pale accent is for text, the active nav
     item and tool pills only; buttons use --primary, which always reads at 4.5:1 or better. */
  :root {
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --ok: #1F8A55; --ok-soft: #E1F4EA; --warn: #B26A00; --warn-soft: #FDF0D9;
    --bad: #C92A2A; --bad-soft: #FBE4E4; --signoff: #287A3A; --violet-st: #6E56CF;
    --hot: #E03131;
  }
  [data-theme="indigo"] { --bg: #F6F7F9; --surface: #FFFFFF; --sunk: #EEF0F3; --line: #E3E6EB; --ink: #111418; --ink-2: #555C66; --ink-3: #8B929C; --accent: #3B5BDB; --accent-soft: #E7ECFD; --primary: #3B5BDB; --on-primary: #FFFFFF; }
  [data-theme="violet"] { --bg: #F7F7FA; --surface: #FFFFFF; --sunk: #EFEEF4; --line: #E4E2EC; --ink: #16151E; --ink-2: #5A5770; --ink-3: #8D8AA0; --accent: #5B45B8; --accent-soft: #EFEBFF; --primary: #6E56CF; --on-primary: #FFFFFF; }
  [data-theme="teal"] { --bg: #F4F8F9; --surface: #FFFFFF; --sunk: #EAF1F3; --line: #DCE6E9; --ink: #0B1114; --ink-2: #4F6268; --ink-3: #82949A; --accent: #0B7285; --accent-soft: #E0F5F8; --primary: #0B7285; --on-primary: #FFFFFF; }
  [data-theme="mono"] { --bg: #FAFAFA; --surface: #FFFFFF; --sunk: #F0F0F2; --line: #E4E4E7; --ink: #0A0A0B; --ink-2: #55555C; --ink-3: #8A8A93; --accent: #111113; --accent-soft: #EDEDEF; --primary: #111113; --on-primary: #FFFFFF; --act: #3B6FD8; }
  @media (prefers-color-scheme: dark) {
    :root { --ok: #5CCB8D; --ok-soft: #15301F; --warn: #F0B44C; --warn-soft: #33270F; --bad: #FF8787; --bad-soft: #3A1717; --violet-st: #C4B5FD; }
    [data-theme="indigo"] { --bg: #0E1015; --surface: #161A21; --sunk: #1D222B; --line: #262C36; --ink: #ECEEF2; --ink-2: #A3AAB5; --ink-3: #6E7581; --accent: #8EA6FF; --accent-soft: #1E2645; --primary: #4263EB; --on-primary: #FFFFFF; }
    [data-theme="violet"] { --bg: #0E0D13; --surface: #16151E; --sunk: #1E1C29; --line: #2A2736; --ink: #EEEDF4; --ink-2: #A9A6B8; --ink-3: #716D82; --accent: #B4A4FF; --accent-soft: #2A2250; --primary: #6E56CF; --on-primary: #FFFFFF; }
    [data-theme="teal"] { --bg: #0B1114; --surface: #121A1E; --sunk: #182328; --line: #223036; --ink: #E8F0F2; --ink-2: #9DB0B6; --ink-3: #66797F; --accent: #5FD4E4; --accent-soft: #0F3239; --primary: #22B8CF; --on-primary: #04161A; }
    [data-theme="mono"] { --bg: #0A0A0B; --surface: #141416; --sunk: #1C1C1F; --line: #27272B; --ink: #EDEDEF; --ink-2: #A1A1A8; --ink-3: #6B6B73; --accent: #EDEDEF; --accent-soft: #2A2A2F; --primary: #EDEDEF; --on-primary: #0A0A0B; --act: #5B8DEF; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 14.5px/1.5 var(--sans); }
  a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
  button { font: 600 13px var(--sans); padding: 7px 13px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--ink-3); }
  button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.primary { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  button.danger { color: var(--bad); }
  button.confirm { background: var(--bad); border-color: var(--bad); color: #fff; }
  button.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
  button.small { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
  .mono { font-family: var(--mono); font-size: .9em; font-variant-numeric: tabular-nums; }
  .muted { color: var(--ink-3); }
  [hidden] { display: none; }

  /* Frame: sidebar + main. The shell is the container the narrow breakpoints follow. */
  .shell { container: shell / inline-size; min-height: 100vh; }
  .app { display: grid; grid-template-columns: 232px minmax(0, 1fr); min-height: 100vh; }
  .side { background: var(--surface); border-right: 1px solid var(--line); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .side .hd { padding: 20px 16px 14px; border-bottom: 1px solid var(--line); }
  .side .r1 { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .tile { width: 40px; height: 40px; border-radius: 10px; background: var(--primary); color: var(--on-primary); display: grid; place-items: center; font: 700 19px var(--sans); flex: none; text-transform: uppercase; }
  .pname { font: 700 19px/1.15 var(--sans); letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .psub { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .pill-state { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 12px; margin-top: 12px; color: var(--ink-3); }
  .pill-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .pill-state.RUNNING { color: var(--ok); } .pill-state.STOPPED, .pill-state.UNKNOWN { color: var(--warn); } .pill-state.CRASHED, .pill-state.offline { color: var(--bad); }
  .navs { padding: 8px 12px; display: flex; flex-direction: column; gap: 2px; }
  .navs a { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); font-weight: 500; text-decoration: none; white-space: nowrap; }
  .navs a:hover { background: var(--sunk); }
  .navs a svg { width: 17px; height: 17px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; }
  .navs a.on { background: var(--accent-soft); color: var(--accent); }
  .count { margin-left: auto; font: 600 11.5px/1 var(--sans); padding: 4px 7px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); }
  .count.hot { background: var(--hot); color: #fff; }
  .side .foot { margin-top: auto; padding: 12px 14px 14px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
  .swatches { display: flex; align-items: center; gap: 7px; margin-top: 8px; }
  .swatches button { width: 18px; height: 18px; padding: 0; border-radius: 50%; border: 0; }
  .swatches button.cur { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--ink-2); }
  main { padding: 22px 26px 40px; min-width: 0; }
  .top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .top h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -.01em; }
  .top .sub { color: var(--ink-3); font-size: 13.5px; }
  .acts { display: flex; gap: 12px; margin-left: auto; flex-wrap: wrap; }
  .group { display: flex; gap: 6px; flex-wrap: wrap; }
  .sec { margin-top: 22px; }
  .sec-h { display: flex; align-items: baseline; gap: 10px; margin-bottom: 9px; }
  .sec-h h3 { margin: 0; font-size: 15.5px; font-weight: 600; }
  .sec-h span { color: var(--ink-3); font-size: 13px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04), 0 3px 12px rgba(16, 24, 40, .04); }
  .empty { padding: 14px 16px; color: var(--ink-3); }
  .tag { display: inline-block; font: 600 11.5px/1 var(--sans); padding: 4px 8px; border-radius: 6px; background: var(--sunk); color: var(--ink-2); white-space: nowrap; }
  .tag.eff, .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.ci, .tag.acc { background: var(--accent-soft); color: var(--accent); }
  .tag.bad { background: var(--bad-soft); color: var(--bad); }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tool { display: inline-block; font: 500 12px/1.3 var(--mono); padding: 2px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .tool.err { background: var(--bad-soft); color: var(--bad); }

  /* Banners: every reason the foreman is not taking work, one line each. */
  .banners { display: grid; gap: 8px; margin-bottom: 16px; }
  .banners:empty { display: none; }
  .banner { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 13.5px; flex-wrap: wrap; }
  .banner.warn { background: var(--warn-soft); color: var(--warn); }
  .banner.bad { background: var(--bad-soft); color: var(--bad); }
  .banner.ok { background: var(--ok-soft); color: var(--ok); }
  .banner .fix { margin-left: auto; font-weight: 500; opacity: .85; }
  .banner a { color: inherit; text-decoration: underline; }
  .nextout { padding: 12px 16px; margin-bottom: 16px; }
  .nextout pre { margin: 0; white-space: pre-wrap; font: 12.5px/1.5 var(--mono); color: var(--ink-2); }
  .nextout .hd { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; font-weight: 600; }

  /* Now */
  .now { padding: 18px 20px; }
  .now.idle { padding: 14px 18px; }
  .now .eyebrow { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .now.idle .eyebrow { margin-bottom: 0; }
  .role { font: 600 11.5px/1 var(--sans); letter-spacing: .04em; text-transform: uppercase; color: var(--accent); background: var(--accent-soft); padding: 5px 9px; border-radius: 6px; }
  .role.parked { color: var(--warn); background: var(--warn-soft); }
  .now h2 { font-size: 20px; margin: 0 0 4px; font-weight: 650; letter-spacing: -.01em; }
  .now .meta { color: var(--ink-2); display: flex; gap: 4px 16px; flex-wrap: wrap; font-size: 13.5px; }
  .now .meta .mono { overflow-wrap: anywhere; }
  .prog { margin: 16px 0 6px; height: 7px; border-radius: 99px; background: var(--sunk); overflow: hidden; }
  .prog i { display: block; height: 100%; border-radius: 99px; background: var(--act, var(--primary)); }
  .prog-l { display: flex; justify-content: space-between; gap: 10px; color: var(--ink-3); font-size: 12.5px; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
  .stat { background: var(--sunk); border-radius: 9px; padding: 9px 13px; }
  .stat b { display: block; font-size: 18px; font-weight: 650; line-height: 1.3; font-variant-numeric: tabular-nums; }
  .stat span { color: var(--ink-3); font-size: 12.5px; }
  .doing { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); display: grid; gap: 6px; }
  .doing .row1 { display: flex; gap: 10px; align-items: center; font-size: 14px; min-width: 0; }
  .doing .x { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .doing .ago { margin-left: auto; color: var(--ink-3); font-size: 12.5px; white-space: nowrap; }
  .doing .said { color: var(--ink-2); font-style: italic; }

  /* Pipeline: the track column and the tag column have fixed widths, so every card's dots sit at
     the same x. Below 760px of pipeline width the track takes its own row under the title. */
  .track { display: grid; grid-template-columns: repeat(5, 1fr); }
  .pl { display: grid; gap: 8px; container: pl / inline-size; }
  .pi { padding: 13px 18px; display: grid; grid-template-columns: minmax(0, 1fr) 280px 160px; column-gap: 32px; row-gap: 12px; align-items: center; }
  .pi .ttl { min-width: 0; }
  .pi .tags { display: flex; gap: 5px; justify-content: flex-end; flex-wrap: wrap; }
  .pi .t { font-weight: 600; font-size: 14.5px; } .pi .t .num { color: var(--ink-3); font-weight: 500; margin-right: 5px; }
  .pi .s { color: var(--ink-2); font-size: 13px; margin-top: 1px; }
  .track .k { position: relative; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
  .track .k::before { content: ""; position: absolute; top: 5px; right: 50%; width: 100%; height: 2px; background: var(--line); }
  .track .k:first-child::before { display: none; }
  .track .k.done::before, .track .k.active::before, .track .k.failed::before { background: var(--ok); }
  .track .d { position: relative; z-index: 1; width: 12px; height: 12px; border-radius: 50%; border: 2px solid var(--line); background: var(--surface); }
  .track .done { color: var(--ok); } .track .done .d { background: var(--ok); border-color: var(--ok); }
  .track .active { color: var(--act, var(--accent)); } .track .active .d { border-color: var(--act, var(--accent)); background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); animation: pulse 1.6s ease-in-out infinite; }
  .track .failed { color: var(--bad); } .track .failed .d { background: var(--bad); border-color: var(--bad); }
  .track .skipped .d { border-style: dashed; }
  @keyframes pulse { 50% { opacity: .55; } }
  @media (prefers-reduced-motion: reduce) { .track .active .d { animation: none; } }
  @container pl (max-width: 760px) {
    .pi { grid-template-columns: minmax(0, 1fr) auto; column-gap: 14px; }
    .pi .ttl { grid-column: 1; grid-row: 1; }
    .pi .tags { grid-column: 2; grid-row: 1; max-width: 160px; }
    .pi .track { grid-column: 1 / -1; grid-row: 2; padding-top: 10px; border-top: 1px solid var(--line); }
  }

  /* Feed */
  .feed { padding: 4px 0; max-height: 340px; overflow: auto; }
  .fr { display: grid; grid-template-columns: 64px 74px minmax(0, 1fr); gap: 10px; padding: 4px 16px; align-items: baseline; font-size: 13.5px; line-height: 1.45; }
  .fr + .fr { border-top: 1px solid color-mix(in srgb, var(--line) 60%, transparent); }
  .fr .tm { color: var(--ink-3); font: 12px var(--mono); }
  .fr .lbl { font: 500 12px var(--mono); color: var(--ink-3); display: block; overflow: hidden; text-overflow: ellipsis; }
  .fr > span:nth-child(2) { min-width: 0; overflow: hidden; }
  .fr .x { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .fr .said { color: var(--ink-2); font-style: italic; white-space: normal; }
  .fr:last-child { background: var(--accent-soft); }
  .chip { font: 600 12px/1 var(--sans); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); cursor: pointer; }

  /* Needs you and Waiting on: groups of rows, oldest first, the wait time large on the left. */
  .grp { margin-top: 20px; }
  .grp:first-child { margin-top: 4px; }
  .gh { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-weight: 600; font-size: 14.5px; flex-wrap: wrap; }
  .gh .c { font: 600 11.5px/1 var(--sans); padding: 3px 7px; border-radius: 999px; background: var(--sunk); color: var(--ink-2); }
  .gh small { color: var(--ink-3); font-weight: 500; font-size: 12.5px; }
  .gh .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .list { overflow: hidden; }
  .it { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 16px; align-items: center; padding: 11px 16px; }
  .it + .it { border-top: 1px solid var(--line); }
  .age { font: 650 17px/1 var(--sans); font-variant-numeric: tabular-nums; color: var(--ink-2); }
  .age small { display: block; font: 500 11px var(--sans); color: var(--ink-3); margin-top: 3px; }
  .age.old { color: var(--warn); }
  .it .t, .wt .t { font-weight: 600; } .it .t .num, .wt .t .num { color: var(--ink-3); font-weight: 500; margin-right: 6px; }
  .it .s, .wt .s { color: var(--ink-2); font-size: 13px; margin-top: 2px; display: flex; gap: 4px 8px; flex-wrap: wrap; align-items: center; }
  .it .acts { display: flex; gap: 6px; margin-left: 0; }
  .mini { display: inline-flex; align-items: center; gap: 6px; }
  .mini .b { width: 60px; height: 5px; background: var(--sunk); border-radius: 99px; overflow: hidden; }
  .mini .b i { display: block; height: 100%; background: var(--ok); border-radius: 99px; }
  button.approve { background: var(--primary); border-color: var(--primary); color: var(--on-primary); }
  button.signoff { background: var(--signoff); border-color: var(--signoff); color: #fff; }
  button.plan { background: var(--warn-soft); border-color: color-mix(in srgb, var(--warn) 45%, transparent); color: var(--warn); }
  .wt { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 11px 16px; }
  .wt + .wt { border-top: 1px solid var(--line); }
  .wt .k { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .wt .since { color: var(--ink-3); font-size: 12.5px; white-space: nowrap; }
  .linkrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 16px; border-radius: 12px; border: 1px dashed var(--line); color: var(--ink-2); margin-top: 20px; flex-wrap: wrap; }
  .linkrow a { font-weight: 600; }

  /* Board: one card per group, a table of its open issues with model and effort pickers. */
  .filters { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .filters input[type="search"] { flex: 0 1 240px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: 13.5px var(--sans); }
  .seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; flex-wrap: wrap; }
  .seg button { border: 0; background: transparent; padding: 5px 11px; border-radius: 7px; font-size: 12.5px; color: var(--ink-2); }
  .seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, .15); }
  .seg button b { color: var(--ink-3); font-weight: 600; margin-left: 4px; }
  .check { margin-left: auto; font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
  .ep { margin-bottom: 14px; }
  .ep.closed { opacity: .8; }
  .eph { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 14px 18px; align-items: center; }
  .eph .k { font-size: 12px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
  .eph .t { font-size: 16px; font-weight: 650; } .eph .t .num { color: var(--ink-3); font-weight: 500; margin-right: 6px; }
  .eph .facts { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; color: var(--ink-2); font-size: 13px; grid-column: 1 / -1; }
  .eph .right { display: flex; gap: 8px; align-items: center; }
  .eph .mini .b { width: 120px; }
  .tk { display: grid; grid-template-columns: minmax(0, 1fr) 112px 60px 112px 100px; gap: 14px; align-items: center; padding: 9px 18px; border-top: 1px solid var(--line); }
  .tk.head { padding: 8px 18px 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); text-transform: uppercase; letter-spacing: .05em; }
  .tk .tt { font-weight: 600; font-size: 14px; } .tk .tt .num { color: var(--ink-3); font-weight: 500; margin-right: 6px; }
  .tk .sub { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; margin-top: 3px; font-size: 12.5px; color: var(--ink-3); }
  .lbl-chip { font: 600 11px/1 var(--sans); padding: 3px 6px; border-radius: 5px; background: var(--sunk); color: var(--ink-2); }
  .lbl-chip.bad { background: var(--bad-soft); color: var(--bad); }
  .st { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; white-space: nowrap; color: var(--ink-3); }
  .st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
  .st.ready { color: var(--accent); } .st.progress { color: var(--warn); } .st.review { color: var(--violet-st); } .st.done { color: var(--ok); }
  .st.off::before { background: transparent; border: 1.5px solid currentColor; }
  .picker { position: relative; }
  .picker > button { width: 100%; display: flex; justify-content: space-between; gap: 4px; padding: 4px 8px; font-size: 12.5px; font-weight: 500; color: var(--ink-3); border-radius: 7px; }
  .picker > button::after { content: "▾"; font-size: 10px; }
  .picker > button.set { border-color: color-mix(in srgb, var(--accent) 55%, transparent); color: var(--accent); background: var(--accent-soft); font-weight: 600; }
  .picker > button.set.eff { border-color: color-mix(in srgb, var(--warn) 55%, transparent); color: var(--warn); background: var(--warn-soft); }
  .menu { position: absolute; right: 0; top: calc(100% + 4px); z-index: 5; background: var(--surface); border: 1px solid var(--line); border-radius: 9px; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); padding: 4px; min-width: 150px; display: grid; }
  .menu button { border: 0; background: transparent; text-align: left; display: flex; justify-content: space-between; gap: 10px; padding: 6px 10px; border-radius: 6px; font-weight: 500; color: var(--ink-2); }
  .menu button:hover { background: var(--sunk); }
  .menu button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .menu button small { color: var(--ink-3); }
  .done-row { padding: 9px 18px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: 13px; }
  .done-row button { border: 0; background: transparent; padding: 0; color: var(--ink-3); font-weight: 600; }
  .done-row .nums { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 6px; }
  @container shell (max-width: 760px) {
    .tk { grid-template-columns: minmax(0, 1fr) auto; }
    .tk.head { display: none; }
    .tk .pr { display: none; }
    .tk .picker { grid-column: span 1; }
  }

  /* Toasts */
  #toasts { position: fixed; right: 18px; bottom: 18px; display: grid; gap: 8px; z-index: 20; max-width: min(420px, calc(100vw - 36px)); }
  .toast { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--ok); border-radius: 10px; padding: 10px 14px; box-shadow: 0 8px 24px rgba(0, 0, 0, .2); font-size: 13.5px; display: flex; gap: 10px; align-items: start; }
  .toast.err { border-left-color: var(--bad); }
  .toast button { margin-left: auto; padding: 0 6px; border: 0; background: transparent; color: var(--ink-3); }

  /* Narrow page: the sidebar becomes a strip of icon tabs, header controls wrap, tiles go 2 x 2. */
  @container shell (max-width: 760px) {
    .app { grid-template-columns: minmax(0, 1fr); }
    .side { position: static; height: auto; min-width: 0; flex-direction: row; align-items: center; border-right: 0; border-bottom: 1px solid var(--line); overflow-x: auto; }
    .side .hd { border-bottom: 0; padding: 10px 8px 10px 12px; }
    .side .hd .psub, .side .hd .pill-state { display: none; }
    .tile { width: 30px; height: 30px; font-size: 15px; border-radius: 8px; }
    .pname { font-size: 16px; }
    .navs { flex-direction: row; padding: 8px; }
    .navs a { padding: 7px 9px; gap: 7px; }
    .side .foot { display: none; }
    main { padding: 16px 14px 28px; }
    .acts { margin-left: 0; width: 100%; }
    .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .prog-l span:first-child { display: none; }
    .fr { grid-template-columns: 68px 66px minmax(0, 1fr); gap: 6px; padding: 4px 12px; }
  }
  @container shell (max-width: 460px) {
    .navs a .lbl { display: none; } .navs a.on .lbl { display: inline; }
    .side .hd .pname { display: none; }
  }
</style>
</head>
<body>
<div class="shell">
<div class="app">
  <nav class="side" aria-label="foreman">
    <div class="hd">
      <div class="r1"><span class="tile" id="tile">f</span><div style="min-width:0"><div class="pname" id="pname">foreman</div><div class="psub" id="psub">foreman</div></div></div>
      <span class="pill-state" id="pill">…</span>
    </div>
    <div class="navs" id="nav">
      <a href="#dashboard" data-nav="dashboard"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg><span class="lbl">Dashboard</span></a>
      <a href="#needs-you" data-nav="needs-you"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6z"/><path d="M10 19a2 2 0 0 0 4 0"/></svg><span class="lbl">Needs you</span><span class="count" id="countNeeds">0</span></a>
      <a href="#waiting" data-nav="waiting"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="lbl">Waiting on</span><span class="count" id="countWaiting">0</span></a>
      <a href="#board" data-nav="board"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/></svg><span class="lbl">Board</span></a>
      <a href="#session" data-nav="session"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lbl">Session</span></a>
    </div>
    <div class="foot"><span id="pidline">–</span><div class="swatches" id="swatches">Theme </div></div>
  </nav>
  <main>
    <section data-tab="dashboard">
      <div class="top">
        <h1>Dashboard</h1>
        <div class="acts">
          <div class="group"><button id="go" class="primary" type="button">Go</button><button id="refresh" type="button" title="Re-read the project board from GitHub and run a tick now">Refresh project</button><button id="next" type="button">Compute next</button></div>
          <div class="group"><button id="stop" class="danger" type="button">Stop</button><button id="abort" class="danger" type="button">Abort</button></div>
        </div>
      </div>
      <div class="banners" id="banners"></div>
      <div class="card nextout" id="nextOut" hidden><div class="hd"><span>Compute next</span><button class="ghost small" id="nextClose" type="button">Close</button></div><pre id="nextText"></pre></div>
      <div id="now"></div>
      <div class="sec"><div class="sec-h"><h3>Pipeline</h3><span id="plMeta"></span></div><div class="pl" id="pipeline"></div></div>
      <div class="sec"><div class="sec-h"><h3>Feed</h3><span id="feedMeta"></span><button class="chip" id="live" type="button" hidden>Back to live</button></div><div class="card feed" id="feed"></div></div>
    </section>
    <section data-tab="needs-you" hidden><div class="top"><h1>Needs you</h1><span class="sub" id="needsMeta"></span></div><div id="needsBody"></div></section>
    <section data-tab="waiting" hidden><div class="top"><h1>Waiting on</h1><span class="sub">what the foreman is waiting for before it can move work forward</span></div><div id="waitBody"></div></section>
    <section data-tab="board" hidden><div class="top"><h1>Board</h1><span class="sub" id="boardMeta"></span></div>
      <div class="filters"><input type="search" id="boardSearch" placeholder="Search issues…" aria-label="Search issues"><div class="seg" id="boardSeg"></div><label class="check"><input type="checkbox" id="showDone"> Show done</label></div>
      <div id="boardBody"></div></section>
    <section data-tab="session" hidden><div class="top"><h1>Session</h1></div><div id="sessionBody"></div></section>
  </main>
</div>
</div>
<div id="toasts" aria-live="polite"></div>
<script>
  const $ = (id) => document.getElementById(id);
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const t = (iso) => (iso ? `${iso.slice(11, 19)}Z` : "–");
  const hm = (iso) => (iso ? `${iso.slice(11, 16)}Z` : "–");
  const mins = (m) => (m >= 60 ? `${Math.floor(m / 60)}h${String(m % 60).padStart(2, "0")}m` : `${m}m`);
  const days = (m) => (m >= 1440 ? `${Math.floor(m / 1440)}d ${Math.floor((m % 1440) / 60)}h` : mins(m));
  const k = (n) => (n >= 1e6 ? `${(n / 1e6).toFixed(1)}M` : n >= 1000 ? `${(n / 1000).toFixed(1)}k` : String(n));
  const usd = (n) => `$${Number(n ?? 0).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  const ago = (iso) => { if (!iso) return "–"; const s = Math.max(0, Math.round((Date.now() - Date.parse(iso)) / 1000)); return s < 60 ? `${s}s ago` : s < 3600 ? `${Math.floor(s / 60)}m ago` : `${Math.floor(s / 3600)}h${String(Math.floor((s % 3600) / 60)).padStart(2, "0")}m ago`; };
  let r = null;            // the last status report
  let repo = null;         // owner/repo, for GitHub links
  const gh = (kind, n) => `https://github.com/${repo ?? ""}/${kind}/${n}`;
  const link = (kind, n, label) => (repo ? `<a href="${gh(kind, n)}" target="_blank" rel="noopener">${esc(label ?? `#${n}`)}</a>` : esc(label ?? `#${n}`));

  // ---- toasts: the result of every action, so the header no longer needs a message line ----
  function toast(message, isError = false) {
    const el = document.createElement("div");
    el.className = `toast${isError ? " err" : ""}`;
    el.innerHTML = `<span>${esc(message)}</span><button type="button" aria-label="Dismiss">×</button>`;
    el.querySelector("button").onclick = () => el.remove();
    $("toasts").appendChild(el);
    if (!isError) setTimeout(() => el.remove(), 5000);
  }
  async function post(path, body) {
    try {
      const res = await fetch(path, body === undefined ? { method: "POST" } : { method: "POST", body: JSON.stringify(body) });
      const j = await res.json();
      j.ok ? toast(j.message) : toast(`error: ${j.error}`, true);
      return j;
    } catch (err) { toast(`error: ${err}`, true); return { ok: false }; }
    finally { refresh(); }
  }

  // ---- routing: one section per tab, chosen by location.hash so a reload keeps the tab ----
  const TABS = ["dashboard", "needs-you", "waiting", "board", "session"];
  let tab = "dashboard";
  function route() {
    const want = location.hash.slice(1);
    tab = TABS.includes(want) ? want : "dashboard";
    for (const s of document.querySelectorAll("section[data-tab]")) s.hidden = s.dataset.tab !== tab;
    for (const a of document.querySelectorAll("[data-nav]")) a.classList.toggle("on", a.dataset.nav === tab);
    if (tab === "session") loadSessions();
  }
  window.addEventListener("hashchange", route);

  // ---- shell: name, state, badges, theme ----
  const THEME_SWATCH = { indigo: "#4263EB", violet: "#6E56CF", teal: "#22B8CF", mono: "#EDEDEF" };
  function renderShell(r) {
    const name = r.instance || (repo ?? "").split("/").pop() || "foreman";
    document.documentElement.dataset.theme = r.theme?.current ?? "indigo";
    document.title = `${name} · foreman`;
    $("tile").textContent = name.slice(0, 1);
    $("pname").textContent = name;
    $("psub").textContent = `foreman · ${r.host}`;
    const label = { RUNNING: "Running", STOPPED: "Stopped", CRASHED: "Crashed", UNKNOWN: "Unknown" }[r.daemon] ?? r.daemon;
    $("pill").className = `pill-state ${r.daemon}`;
    $("pill").textContent = `${label}${r.uptimeMinutes != null ? ` · up ${days(r.uptimeMinutes)}` : ""}${r.stopPresent ? " · STOP file" : ""}`;
    $("pidline").textContent = r.pid ? `pid ${r.pid}` : "no pid";
    const needs = r.attention?.needsYou ?? 0;
    $("countNeeds").textContent = String(needs);
    $("countNeeds").classList.toggle("hot", needs > 0);
    $("countWaiting").textContent = String(r.attention?.waiting ?? 0);
    const cur = r.theme?.current;
    $("swatches").innerHTML = `Theme ${(r.theme?.choices ?? []).map((n) => `<button type="button" data-theme-pick="${esc(n)}" class="${n === cur ? "cur" : ""}" style="background:${THEME_SWATCH[n] ?? "#888"}" title="${esc(n)}" aria-label="${esc(n)} theme"></button>`).join("")}`;
    for (const b of $("swatches").querySelectorAll("button")) b.onclick = () => { if (b.dataset.themePick !== cur) post("/api/theme", { theme: b.dataset.themePick }); };
  }

  // ---- dashboard ----
  const BANNER = {
    stop: { cls: "warn", fix: "Go resumes" },
    preflight: { cls: "bad", fix: "fix the cause; the next tick re-checks" },
    cap: { cls: "warn", fix: '<a href="#session">raise the cap</a>' },
    paused: { cls: "warn", fix: "Resume on the Board tab" },
  };
  function bannerRows(r) {
    const rows = (r.attention?.banners ?? []).map((w) => ({ cls: BANNER[w.kind]?.cls ?? "warn", text: esc(w.detail), fix: BANNER[w.kind]?.fix ?? "" }));
    if (r.daemon === "UNKNOWN") rows.push({ cls: "warn", text: "no state.json: restart the daemon", fix: "" });
    if (r.daemon === "CRASHED") rows.push({ cls: "bad", text: "the daemon crashed", fix: "check foreman.err.log, then start it" });
    if (r.current?.stalled) rows.push({ cls: "bad", text: `session stalled: no output for ${mins(r.current.silentMinutes)}`, fix: "Abort ends it" });
    if (r.orphan) rows.push({ cls: "bad", text: `child ${esc(r.orphan.pid)} still running for #${esc(r.orphan.issue)}`, fix: "" });
    if (r.unfinished) rows.push({ cls: "bad", text: `${esc(r.unfinished.mode)} bookkeeping unfinished for ${esc(r.unfinished.role)} #${esc(r.unfinished.issue)}`, fix: "run ctl abort" });
    if (r.stopping) rows.push({ cls: "warn", text: `${esc(r.stopping.mode)} requested at ${t(r.stopping.at)}`, fix: "" });
    return rows;
  }
  const bannerHtml = (rows) => rows.map((b) => `<div class="banner ${b.cls}"><span>${b.text}</span>${b.fix ? `<span class="fix">${b.fix}</span>` : ""}</div>`).join("");

  function renderNow(r) {
    const el = $("now");
    const c = r.current;
    if (!c) {
      // "idle" is reserved for a tick that found nothing eligible; between a finished session and
      // the next tick the daemon is asleep on a schedule, and says so.
      const phase = r.nowPhase === "parked"
        ? { label: "parked", sub: esc(r.tick?.preflight?.reason ?? "preflight failed") }
        : r.nowPhase === "between_ticks"
          ? { label: "between ticks", sub: `next tick ${t(r.tick?.nextAt)}` }
          : r.nowPhase === "ticking"
            ? { label: "ticking", sub: `since ${t(r.tick?.lastAt)}` }
            : { label: "idle", sub: `last tick ${t(r.tick?.lastAt)} · next ${t(r.tick?.nextAt)}` };
      el.className = "card now idle";
      el.innerHTML = `<div class="eyebrow"><span class="role${r.nowPhase === "parked" ? " parked" : ""}">${phase.label}</span><span class="muted">${phase.sub}</span></div>`;
      return;
    }
    const a = c.activity;
    const pct = Math.min(100, Math.round((c.elapsedMinutes / c.limitMinutes) * 100));
    const pipe = (r.board?.pipeline ?? []).find((p) => p.issue === c.issue);
    const tokens = a ? a.tokens.input + a.tokens.output + (a.tokens.cacheRead ?? 0) + (a.tokens.cacheWrite ?? 0) : null;
    const stat = (v, l) => `<div class="stat"><b>${v}</b><span>${l}</span></div>`;
    const doing = a?.lastTool
      ? `<div class="doing"><div class="row1"><span class="tool${a.lastError && a.lastError.at >= a.lastTool.at ? " err" : ""}">${esc(a.lastTool.name)}</span><span class="x">${esc(a.lastTool.summary)}</span><span class="ago" data-at="${esc(a.lastTool.at)}">${ago(a.lastTool.at)}</span></div>${a.lastText ? `<div class="said">“${esc(a.lastText.text)}”</div>` : ""}</div>`
      : `<div class="doing"><div class="said">${a ? "no tool call yet" : "no live activity: restart the daemon to enable stream-json"}</div></div>`;
    el.className = "card now";
    el.innerHTML = `<div class="eyebrow"><span class="role">${esc(c.role)}</span><span class="tag">round ${esc(c.round)}</span><span class="tag">attempt ${esc(c.attempt)}</span>${pipe?.effort ? `<span class="tag eff">${esc(pipe.effort)} effort</span>` : ""}${c.resume ? '<span class="tag">resumed</span>' : ""}</div>
      <h2>${link("issues", c.issue)} · ${esc(c.title)}</h2>
      <div class="meta">${c.pr ? `<span>${link("pull", c.pr, `PR #${c.pr}`)}</span>` : ""}${a?.model ? `<span>${esc(a.model)}</span>` : ""}<span class="mono">${esc(c.branch)}</span><span class="mono muted">session ${esc(c.sessionId.slice(0, 8))}${c.childPid ? ` · child ${esc(c.childPid)}` : ""}</span></div>
      <div class="prog"><i style="width:${pct}%"></i></div>
      <div class="prog-l"><span>Started ${t(c.startedAt)}</span><span>${mins(c.elapsedMinutes)} of ${c.limitMinutes}m</span><span>Deadline ${hm(c.deadlineAt)}</span></div>
      <div class="stats">${stat(a ? a.turns : "–", "turns")}${stat(tokens === null ? "–" : k(tokens), "tokens")}${stat(a?.rateLimit ? `${Math.round(a.rateLimit.fiveHour * 100)}%` : "–", "5h window")}${stat(a?.rateLimit ? `${Math.round(a.rateLimit.sevenDay * 100)}%` : "–", "7d window")}</div>${doing}`;
  }

  const STAGES = [["build", "Build"], ["review", "Review"], ["validate", "Validate"], ["ci", "CI"], ["merge", "Merge"]];
  // CI reports check states; the track speaks stage states.
  const CI_STAGE = { success: "done", pending: "active", failure: "failed", none: "pending" };
  function track(stages) {
    return `<div class="track">${STAGES.map(([key, label]) => {
      const st = key === "ci" ? CI_STAGE[stages.ci] ?? "pending" : stages[key];
      return `<div class="k ${esc(st)}" title="${label}: ${esc(st)}"><span class="d"></span>${label}</div>`;
    }).join("")}</div>`;
  }
  function renderPipeline(rows) {
    $("plMeta").textContent = rows.length ? `${rows.length} in flight` : "";
    $("pipeline").innerHTML = rows.length
      ? rows.map((p) => {
          const tags = [
            p.model ? `<span class="tag acc" title="every session on this issue runs as ${esc(p.model)}">${esc(p.model)}</span>` : "",
            p.effort ? `<span class="tag eff">${esc(p.effort)} effort</span>` : "",
            p.blocked ? '<span class="tag bad">blocked</span>' : "",
            !p.blocked && p.stages.ci === "pending" ? '<span class="tag ci">CI pending</span>' : "",
            !p.blocked && p.stages.merge === "active" ? '<span class="tag ok">mergeable</span>' : "",
          ].join("");
          const sub = [p.pr ? link("pull", p.pr, `PR #${p.pr}`) : "no PR yet", p.claim ? `${esc(p.claim.host)} · ${esc(p.claim.role)} r${esc(p.claim.round)}` : "unclaimed", p.fixRound > 1 ? `fix round ${esc(p.fixRound)}` : ""].filter(Boolean).join(" · ");
          return `<div class="card pi"><div class="ttl"><div class="t"><span class="num">${link("issues", p.issue)}</span>${esc(p.title)}</div><div class="s">${sub}</div></div>${track(p.stages)}<div class="tags">${tags}</div></div>`;
        }).join("")
      : '<div class="card empty">nothing in flight</div>';
  }

  // ---- feed: the running session, or one pinned from the Session tab ----
  let feedSession = null;   // session id whose feed is shown
  let feedPinned = false;   // true after "View feed", so polling does not switch it back
  let lastRenderedSession = null;
  $("live").onclick = () => { feedPinned = false; feedSession = r?.current?.sessionId ?? r?.recent?.[0]?.sessionId ?? null; loadFeed(); };
  async function loadFeed() {
    const el = $("feed");
    $("live").hidden = !feedPinned;
    if (!feedSession) { el.innerHTML = '<div class="empty">no session yet</div>'; $("feedMeta").textContent = ""; return; }
    let j;
    try { j = await (await fetch(`/api/feed?session=${encodeURIComponent(feedSession)}&limit=50`)).json(); } catch { return; }
    const entries = Array.isArray(j.entries) ? j.entries : [];
    const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 8;
    const which = r?.current?.sessionId === feedSession ? `${r.current.role} #${r.current.issue}` : `session ${feedSession.slice(0, 8)}`;
    $("feedMeta").textContent = `${which} · newest last`;
    el.innerHTML = entries.length
      ? entries.map((e) => {
          const kind = e.kind === "tool" ? `<span class="tool">${esc(e.name)}</span>` : e.kind === "tool_error" ? `<span class="tool err">${esc(e.name)}</span>` : `<span class="lbl">${esc(e.kind)}</span>`;
          const s = e.kind === "tool" ? `<span class="x">${esc(e.summary)}</span>`
            : e.kind === "text" ? `<span class="said">“${esc(e.text)}”</span>`
            : e.kind === "init" ? `<span class="x">${esc(e.model)}</span>`
            : e.kind === "tool_error" ? `<span class="x">${esc(e.name)} returned an error</span>`
            : e.kind === "rate_limit" ? `<span class="x">5h ${Math.round(e.fiveHour * 100)}% · 7d ${Math.round(e.sevenDay * 100)}%</span>`
            : `<span class="x">${esc(e.subtype)} · ${esc(e.outcome ?? "no outcome")} · ${esc(e.turns)} turns · ${usd(e.costUsd)}</span>`;
          return `<div class="fr"><span class="tm">${t(e.t)}</span><span>${kind}</span>${s}</div>`;
        }).join("")
      : '<div class="empty">no events recorded for this session</div>';
    if (atBottom || feedSession !== lastRenderedSession) el.scrollTop = el.scrollHeight;
    lastRenderedSession = feedSession;
  }

  // ---- controls ----
  const pending = {};
  function armed(cmd, btn) {
    const reset = () => { pending[cmd] = null; btn.classList.remove("confirm"); btn.textContent = cmd[0].toUpperCase() + cmd.slice(1); };
    if (pending[cmd]) { clearTimeout(pending[cmd]); reset(); return true; }
    btn.classList.add("confirm"); btn.textContent = `Confirm ${cmd}?`;
    pending[cmd] = setTimeout(reset, 5000);
    return false;
  }
  for (const cmd of ["stop", "abort"]) $(cmd).onclick = () => { if (armed(cmd, $(cmd))) post(`/api/${cmd}`); };
  $("go").onclick = () => post("/api/go");
  // Board edits made by hand (Status, item-add, labels) reach the page on the next tick; this
  // asks for that tick now instead of waiting out the poll interval.
  $("refresh").onclick = () => post("/api/refresh");
  $("nextClose").onclick = () => { $("nextOut").hidden = true; };
  $("next").onclick = async () => {
    $("nextOut").hidden = false; $("nextText").textContent = "computing…";
    const j = await (await fetch("/api/next")).json();
    const lines = j.actions.map((a, i) => (i === j.stopAt ? `${a}  ← would stop here` : a));
    $("nextText").textContent = [`plan   ${lines.join(", ")}`, ...j.explain.map((e) => `       ${e}`), "", ...j.prs.map((p) => `PR #${p.pr} → ${p.issue == null ? "?" : `#${p.issue}`}  status ${p.status}  checks ${p.checks}  labels [${p.labels.join(",")}]   ${p.reason === "eligible to merge" ? p.reason : `not eligible: ${p.reason}`}`)].join("\n");
  };

  // ---- Needs you: grouped by the action the owner takes ----
  const waitDays = (iso) => (iso ? Math.max(0, Math.floor((Date.now() - Date.parse(iso)) / 86_400_000)) : null);
  const subjectLink = (subject) => { const m = /^(PR |epic )?#(\d+)$/.exec(subject); return m ? link(m[1] === "PR " ? "pull" : "issues", m[2], subject) : esc(subject); };
  const oldestFirst = (a, b) => (a.since ?? "9999").localeCompare(b.since ?? "9999");
  // Label gates a human owns. The confirm text spells out the exact label change, because a
  // mis-click here closes a phase or starts a $5 planning session.
  const OWNER = {
    sign_off:       { label: "Sign off",       cls: "signoff", ask: (n) => `Sign off #${n}?\n\nAdds signed-off, removes needs-owner, and closes the epic.` },
    approve_plan:   { label: "Approve plan",   cls: "approve", ask: (n) => `Approve the plan on #${n}?\n\nAdds plan-approved. The foreman then creates the task issues and starts building.` },
    start_planning: { label: "Start planning", cls: "plan",    ask: (n) => `Start planning #${n}?\n\nAdds agent-ready. A planner session costs roughly $5.` },
    pause:          { label: "Pause",          cls: "",        ask: (n) => `Pause #${n}?\n\nAdds foreman:pause. No new claims under this phase on any Mac.` },
    unpause:        { label: "Resume",         cls: "",        ask: (n) => `Resume #${n}?\n\nRemoves foreman:pause.` },
  };
  function ownerAct(epic, action) {
    if (!window.confirm((OWNER[action]?.ask ?? ((n) => `${action} #${n}?`))(epic))) return;
    post("/api/owner", { epic, action });
  }
  function unblock(issue) {
    if (!window.confirm(`Unblock #${issue}?\n\nRemoves the blocked label, sets Status Ready, and comments on the issue. The foreman may claim it on the next tick — fix whatever blocked it first.`)) return;
    post("/api/unblock", { issue });
  }
  const ageCell = (since) => {
    const d = waitDays(since);
    return d === null ? '<div class="age">–</div>' : `<div class="age${d > 30 ? " old" : ""}">${d}d<small>waiting</small></div>`;
  };
  const ownerButton = (epic, action) => `<button type="button" class="${OWNER[action].cls}" data-owner="${esc(action)}" data-epic="${esc(epic)}">${OWNER[action].label}</button>`;
  function group(title, dot, note, rows) {
    if (!rows.length) return "";
    return `<div class="grp"><div class="gh">${dot ? `<span class="dot" style="background:${dot}"></span>` : ""}${esc(title)} <span class="c">${rows.length}</span><small>${note}</small></div><div class="card list">${rows.join("")}</div></div>`;
  }
  function renderNeedsYou(r) {
    const owner = r.board?.owner ?? [];
    const needs = (r.board?.needsYou ?? []).filter((n) => n.reviewOf === null).sort(oldestFirst);
    const phases = new Map((r.board?.phases ?? []).map((p) => [p.epic, p]));
    const waits = r.board?.waiting ?? [];
    const by = (action) => owner.filter((o) => o.actions.includes(action)).sort(oldestFirst);
    const row = (age, title, sub, acts) => `<div class="it">${age}<div><div class="t">${title}</div>${sub ? `<div class="s">${sub}</div>` : ""}</div><div class="acts">${acts}</div></div>`;
    const approve = by("approve_plan").map((o) => row(ageCell(o.since), `<span class="num">${link("issues", o.epic)}</span>${esc(o.title)}`, `plan drafted · ${link("issues", o.epic, "read the plan")}`, ownerButton(o.epic, "approve_plan")));
    const signOff = by("sign_off").map((o) => {
      const p = phases.get(o.epic);
      const progress = p ? `<span class="mini"><span class="b"><i style="width:${p.tasksTotal ? Math.round((p.tasksDone / p.tasksTotal) * 100) : 0}%"></i></span>${p.tasksDone}/${p.tasksTotal} tasks</span><span>${usd(p.spendUsd)}</span>` : "";
      return row(ageCell(o.since), `<span class="num">${link("issues", o.epic)}</span>${esc(o.title)}`, `${progress}${o.review ? `<span>review ${link("issues", o.review)}</span>` : ""}`, ownerButton(o.epic, "sign_off"));
    });
    const plan = by("start_planning").map((o) => row('<div class="age">–</div>', `<span class="num">${link("issues", o.epic)}</span>${esc(o.title)}`, "", ownerButton(o.epic, "start_planning")));
    const tags = (n) => n.labels.map((l) => `<span class="tag${l === "blocked" ? " bad" : ""}">${esc(l)}</span>`).join("");
    const blocked = needs.filter((n) => n.labels.includes("blocked")).map((n) => {
      const why = waits.find((w) => w.subject === `#${n.issue}` && w.detail.startsWith(`#${n.issue} blocked`))?.detail.replace(`#${n.issue} blocked`, "").replace(/^:\s*/, "");
      return row(ageCell(n.since), `<span class="num">${link("issues", n.issue)}</span>${esc(n.title)}`, `${tags(n)}${why ? `<span>${esc(why)}</span>` : ""}`, `<button type="button" data-unblock="${esc(n.issue)}">Unblock</button>`);
    });
    const answer = needs.filter((n) => !n.labels.includes("blocked")).map((n) => row(ageCell(n.since), `<span class="num">${link("issues", n.issue)}</span>${esc(n.title)}`, `${tags(n)}${n.phaseReview ? "<span>epic already closed</span>" : ""}`, repo ? `<a class="tag" href="${gh("issues", n.issue)}" target="_blank" rel="noopener">Open ↗</a>` : ""));
    const counted = approve.length + signOff.length + blocked.length + answer.length;
    $("needsMeta").textContent = counted ? `${counted} waiting on you · oldest first in each group` : "";
    const html = [
      group("Approve a plan", "var(--primary)", "the planner drafted these; building starts after approval", approve),
      group("Sign off a phase", "var(--signoff)", "phase review is done; signing off closes the epic", signOff),
      group("Ready to plan", "var(--warn)", "not counted in the badge · a planner session costs about $5", plan),
      group("Unblock", "", "fix the cause first; Unblock moves it back to Ready", blocked),
      group("Answer or close", "", "decisions and owner tasks; answer on GitHub", answer),
    ].join("");
    const el = $("needsBody");
    el.innerHTML = html || '<div class="card empty">nothing is waiting on you</div>';
    for (const b of el.querySelectorAll("button[data-owner]")) b.onclick = () => ownerAct(Number(b.dataset.epic), b.dataset.owner);
    for (const b of el.querySelectorAll("button[data-unblock]")) b.onclick = () => unblock(Number(b.dataset.unblock));
  }

  // ---- Waiting on: what the foreman resolves by itself, grouped by kind ----
  const WAIT_GROUPS = [["ci", "CI"], ["review_cycle", "Review cycle"], ["dependency", "Dependencies"], ["other_host", "Another Mac"], ["phase_gate", "Phase gate"], ["human", "Fix on GitHub"]];
  function renderWaiting(r) {
    const rows = r.attention?.waitRows ?? [];
    const issues = new Map((r.board?.issues ?? []).map((i) => [i.issue, i]));
    const banners = bannerRows(r);
    const clear = `<div class="banner ok"><span>Nothing stops new claims: no STOP file, preflight ok, ${esc(r.today?.count ?? 0)} of ${esc(r.today?.cap ?? 0)} sessions today</span></div>`;
    const depState = (w) => {
      const deps = [...w.detail.replace(/^.*waits on /, "").matchAll(/#(\d+)/g)].map((m) => Number(m[1]));
      return deps.map((d) => `#${d} ${esc(issues.get(d)?.status ?? (issues.has(d) ? "off board" : "not open"))}`).join(" · ");
    };
    const row = (w) => `<div class="wt"><span class="k"></span><div><div class="t">${w.detail.startsWith(w.subject) ? `${subjectLink(w.subject)}${esc(w.detail.slice(w.subject.length))}` : esc(w.detail)}</div>${w.kind === "dependency" ? `<div class="s">${depState(w)}</div>` : ""}</div><span class="since">${w.since ? `since ${t(w.since)}` : ""}</span></div>`;
    const groups = WAIT_GROUPS.map(([kind, title]) => group(title, "", "", rows.filter((w) => w.kind === kind).map(row))).join("");
    const needs = r.attention?.needsYou ?? 0;
    $("waitBody").innerHTML = `<div class="banners">${banners.length ? bannerHtml(banners) : clear}</div>${groups || '<div class="card empty">nothing else is pending</div>'}<div class="linkrow"><span>Items waiting on you are on the Needs you tab, not repeated here.</span><a href="#needs-you">Needs you · ${needs} →</a></div>`;
  }

  // ---- Board: every open issue, grouped under its epic ----
  // UI state lives outside the renderer, so the 3 s re-render keeps the search, the filter, an
  // open picker and an expanded done list exactly as the owner left them.
  let boardQuery = "";
  let boardFilter = "all";
  let showDone = false;
  const openPicker = { issue: null, kind: null };
  const openDone = new Set();
  const STATUS_CLASS = { Backlog: "", Ready: "ready", "In Progress": "progress", "In Review": "review", Done: "done" };
  const FILTERS = [
    ["all", "All", () => true],
    ["Ready", "Ready", (i) => i.status === "Ready"],
    ["In Progress", "In progress", (i) => i.status === "In Progress"],
    ["In Review", "In review", (i) => i.status === "In Review"],
    ["Backlog", "Backlog", (i) => i.status === "Backlog"],
    ["blocked", "Blocked", (i) => i.blocked],
    ["off", "Off board", (i) => i.status === null],
  ];
  const GROUP_STATE = { planning: ["Planning", "warn"], plan_waiting: ["Plan waiting", "warn"], building: ["Building", "acc"], signoff_waiting: ["Sign-off waiting", "ok"], not_started: ["Not started", ""] };
  $("boardSearch").oninput = (e) => { boardQuery = e.target.value.trim().toLowerCase(); if (r) renderBoard(r); };
  $("showDone").onchange = (e) => { showDone = e.target.checked; if (r) renderBoard(r); };
  document.addEventListener("click", (e) => {
    if (openPicker.issue !== null && !e.target.closest(".picker")) { openPicker.issue = null; if (r) renderBoard(r); }
  });
  // A daemon older than per-task effort reports no `effort`; its sessions run at the default.
  const effortDefault = () => r?.effort?.default ?? "high";

  function setTaskModel(issue, model, current) {
    const what = model === "default" ? `the global model${current ? ` (drops ${current})` : ""}` : model;
    if (!window.confirm(`Run every foreman session on #${issue} as ${what}?\n\nBuilder, reviewer and validator alike, outranking the model on the Session tab. A session running now keeps the model it started with; the issue's next session uses this.`)) return;
    post("/api/task-model", { issue, model });
  }
  function setTaskEffort(issue, level, current) {
    const what = level === effortDefault() ? `the default ${level} effort${current ? ` (drops ${current})` : ""}` : `${level} effort`;
    if (!window.confirm(`Run every foreman session on #${issue} at ${what}?\n\nBuilder, reviewer and validator alike. A session running now keeps the effort it started with; the issue's next session uses this.`)) return;
    post("/api/task-effort", { issue, effort: level });
  }
  function picker(i, kind) {
    const isModel = kind === "model";
    const value = isModel ? i.model ?? "default" : i.effort ?? effortDefault();
    const set = isModel ? i.model !== null : i.effort !== null;
    const options = isModel ? [...(r.model?.choices ?? []), "default"] : r.effort?.levels ?? [];
    const open = openPicker.issue === i.issue && openPicker.kind === kind;
    const menu = open
      ? `<div class="menu">${options.map((o) => `<button type="button" data-pick="${esc(o)}" class="${o === value ? "on" : ""}">${esc(o)}${!isModel && o === effortDefault() ? "<small>default</small>" : ""}</button>`).join("")}</div>`
      : "";
    return `<div class="picker" data-issue="${esc(i.issue)}" data-kind="${kind}"><button type="button" class="${set ? `set${isModel ? "" : " eff"}` : ""}" aria-haspopup="true" aria-expanded="${open}">${esc(value)}</button>${menu}</div>`;
  }
  function hintsFor(i, nextClaim, pipe) {
    const out = [];
    if (i.openDependsOn.length) out.push(`waits on ${i.openDependsOn.map((d) => `#${d}`).join(", ")}`);
    if (nextClaim === i.issue) out.push("next to claim");
    const failed = pipe && ["build", "review", "validate"].find((s) => pipe.stages[s] === "failed");
    if (failed) out.push(`${failed === "validate" ? "validator" : failed} failed${pipe.fixRound > 1 ? ` · fix round ${pipe.fixRound}` : ""}`);
    return out.map((h) => `<span>${esc(h)}</span>`).join("");
  }
  function renderBoard(r) {
    const all = r.board?.issues ?? [];
    const groups = r.board?.groups ?? [];
    const phases = new Map((r.board?.phases ?? []).map((p) => [p.epic, p]));
    const pipeline = new Map((r.board?.pipeline ?? []).map((p) => [p.issue, p]));
    const claim = (r.lastPlan ?? []).map((a) => /^claim#(\d+)$/.exec(a)).find(Boolean);
    const nextClaim = claim ? Number(claim[1]) : null;
    const match = (i) => !boardQuery || String(i.issue).includes(boardQuery) || i.title.toLowerCase().includes(boardQuery);
    const filterFn = (FILTERS.find(([key]) => key === boardFilter) ?? FILTERS[0])[2];
    const shown = all.filter((i) => match(i) && filterFn(i));
    $("boardSeg").innerHTML = FILTERS.map(([key, label, fn]) => `<button type="button" data-filter="${esc(key)}" class="${key === boardFilter ? "on" : ""}">${label}<b>${all.filter(fn).length}</b></button>`).join("");
    for (const b of $("boardSeg").querySelectorAll("button")) b.onclick = () => { boardFilter = b.dataset.filter; renderBoard(r); };
    $("boardMeta").textContent = r.board ? `${all.length} open issues in ${groups.length} groups · read from the last tick, ${hm(r.board.at)}` : "";
    const narrowed = boardQuery || boardFilter !== "all";
    const cards = groups.map((g) => {
      const rows = shown.filter((i) => i.group === g.key);
      if (narrowed && !rows.length) return "";
      const p = g.epic !== null ? phases.get(g.epic) : null;
      const [stateLabel, stateCls] = g.state ? GROUP_STATE[g.state] ?? [g.state, ""] : [null, ""];
      const facts = p
        ? `<span class="mini"><span class="b"><i style="width:${p.tasksTotal ? Math.round((p.tasksDone / p.tasksTotal) * 100) : 0}%"></i></span>${p.tasksDone} of ${p.tasksTotal} done</span><span>${usd(p.spendUsd)} · ${p.sessions} sessions</span><span>${p.medianMergeMinutes === null ? "no merge yet" : `median ${mins(p.medianMergeMinutes)} claim→merge`}</span>`
        : rows.length ? `<span>${rows.length} open</span>` : "<span>no tasks yet</span>";
      const head = `<div class="eph"><div>${g.phase !== null ? `<div class="k">Phase ${esc(g.phase)}</div>` : ""}<div class="t">${g.epic !== null ? `<span class="num">${link("issues", g.epic)}</span>` : ""}${esc(g.title)}</div></div><div class="right">${stateLabel ? `<span class="tag ${stateCls}">${esc(stateLabel)}</span>` : ""}${g.paused ? '<span class="tag warn">Paused</span>' : ""}${g.kind === "epic" ? ownerButton(g.epic, g.paused ? "unpause" : "pause") : ""}</div><div class="facts">${facts}</div></div>`;
      const table = rows.length
        ? `<div class="tk head"><span>Issue</span><span>Status</span><span>PR</span><span>Model</span><span>Effort</span></div>${rows.map((i) => {
            const labels = i.labels.map((l) => `<span class="lbl-chip${l === "blocked" ? " bad" : ""}">${esc(l)}</span>`).join("");
            const status = i.status === null ? '<span class="st off">Off board</span>' : `<span class="st ${STATUS_CLASS[i.status] ?? ""}">${esc(i.status)}</span>`;
            return `<div class="tk"><div><div class="tt"><span class="num">${link("issues", i.issue)}</span>${esc(i.title)}</div><div class="sub">${labels}${hintsFor(i, nextClaim, pipeline.get(i.issue))}</div></div>${status}<span class="pr mono">${i.pr ? link("pull", i.pr) : "–"}</span>${picker(i, "model")}${picker(i, "effort")}</div>`;
          }).join("")}`
        : "";
      const done = showDone && g.doneTasks.length
        ? `<div class="done-row"><button type="button" data-done="${esc(g.key)}">${openDone.has(g.key) ? "▾" : "▸"} ${g.doneTasks.length} done</button>${openDone.has(g.key) ? `<div class="nums">${g.doneTasks.map((n) => link("issues", n)).join("")}</div>` : ""}</div>`
        : "";
      return `<div class="card ep${g.kind === "closed" ? " closed" : ""}">${head}${table}${done}</div>`;
    }).join("");
    const el = $("boardBody");
    el.innerHTML = cards || `<div class="card empty">${r.board ? "no open issues match" : "the board appears after the first tick"}</div>`;
    for (const b of el.querySelectorAll("button[data-owner]")) b.onclick = () => ownerAct(Number(b.dataset.epic), b.dataset.owner);
    for (const b of el.querySelectorAll("button[data-done]")) b.onclick = () => { openDone.has(b.dataset.done) ? openDone.delete(b.dataset.done) : openDone.add(b.dataset.done); renderBoard(r); };
    for (const p of el.querySelectorAll(".picker")) {
      const issue = Number(p.dataset.issue);
      const kind = p.dataset.kind;
      p.querySelector(":scope > button").onclick = () => {
        const same = openPicker.issue === issue && openPicker.kind === kind;
        openPicker.issue = same ? null : issue;
        openPicker.kind = same ? null : kind;
        renderBoard(r);
      };
      for (const o of p.querySelectorAll("button[data-pick]")) o.onclick = () => {
        const row = all.find((i) => i.issue === issue);
        openPicker.issue = null;
        renderBoard(r);
        if (kind === "model") { if (o.dataset.pick !== (row?.model ?? "default")) setTaskModel(issue, o.dataset.pick, row?.model ?? null); }
        else if (o.dataset.pick !== (row?.effort ?? effortDefault())) setTaskEffort(issue, o.dataset.pick, row?.effort ?? null);
      };
    }
  }

  // ---- tabs filled in by later sections ----
  function loadSessions() {}

  async function refresh() {
    try { r = await (await fetch("/api/status")).json(); }
    catch { $("pill").textContent = "page offline"; $("pill").className = "pill-state offline"; return; }
    repo = r.repo ?? repo;
    renderShell(r);
    $("banners").innerHTML = bannerHtml(bannerRows(r));
    renderNow(r);
    renderPipeline(r.board?.pipeline ?? []);
    renderNeedsYou(r);
    renderWaiting(r);
    renderBoard(r);
    if (!feedPinned) feedSession = r.current?.sessionId ?? r.recent?.[0]?.sessionId ?? null;
    loadFeed();
  }

  setInterval(() => { for (const el of document.querySelectorAll("[data-at]")) el.textContent = ago(el.dataset.at); }, 1000);
  route();
  refresh();
  setInterval(refresh, 3000);
</script>
</body>
</html>
